# Production stack on the VPS (ADR-0015): PostgreSQL, the Flask API and the Teacher Studio.
# Lives on the server in /srv/ricingo next to `.env` (secrets, the deployed version) and is
# replaced by deploy.sh from the release tag on every deploy — edit it here, never on the server.
# Caddy (/srv/proxy) is the only thing reachable from the internet; it forwards to the
# loopback ports below.
name: ricingo

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *restart
    image: ${IMAGE_PREFIX:?set in .env}/rici-api:${RICI_VERSION:?set by deploy.sh}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Caddy replaces X-Forwarded-For with the client address (ADR-0015).
      TRUSTED_PROXY_HOPS: '1'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - '127.0.0.1:8100:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  studio:
    <<: *restart
    image: ${IMAGE_PREFIX}/rici-studio:${RICI_VERSION}
    environment:
      # Server-side calls to the API stay on this stack's private network.
      RICI_API_URL: http://api:8000
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
