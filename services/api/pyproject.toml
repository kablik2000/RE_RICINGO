[project]
name = "rici-api"
version = "0.1.0"
description = "Italština RICI backend: REST API /api/v1 over PostgreSQL (ADR-0010)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "gunicorn>=23.0",
  "jsonschema>=4.23",
  "alembic>=1.16",
  "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rici_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; test-only passwords

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
