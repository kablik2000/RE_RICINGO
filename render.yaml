# Render Blueprint (ADR-0014): the Flask API, the Teacher Studio and PostgreSQL in Frankfurt (EU).
# Create everything at once: Render dashboard → New → Blueprint → this repository.
# Steps after the first deploy (first lecturer account, e-mail): docs/setup/NASAZENI_RENDER.md.
# Spec: https://render.com/docs/blueprint-spec

databases:
  - name: rici-db
    region: frankfurt
    # Paid plan: the free database is deleted after 30 days.
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    databaseName: rici
    user: rici
    # No outside access: only services on the private network reach the database.
    ipAllowList: []

services:
  # Flask API: the Studio's backend and the app's content API (ADR-0010, ADR-0013).
  - type: web
    name: rici-api
    runtime: docker
    region: frankfurt
    # Paid: free services sleep, cannot receive private-network requests and have no Shell.
    plan: 0.5c-512mb
    branch: main
    rootDir: services/api
    # Deploy only commits that passed CI (.github/workflows/ci.yml).
    autoDeployTrigger: checksPass
    # Runs before each deploy (paid plans): brings the database schema up to date.
    preDeployCommand: flask --app rici_api.wsgi db-upgrade
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      # gunicorn listens on 8000 (Dockerfile).
      - key: PORT
        value: '8000'
      # Render's load balancer appends the client address to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      # Rewritten to the psycopg 3 driver by the API (config.py).
      - key: DATABASE_URL
        fromDatabase:
          name: rici-db
          property: connectionString
      # E-mail (invitations): SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_STARTTLS
      # and MAIL_FROM are added in the dashboard once a provider is chosen (Q-10).

  # Teacher Studio (Next.js): server-rendered, so a web service, not a static site.
  - type: web
    name: rici-studio
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: checksPass
    # Only Studio-related changes redeploy it (the repository also holds the mobile app).
    buildFilter:
      paths:
        - apps/studio/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    # Installs the Studio and the workspace packages it uses, not the mobile app.
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --filter "@ricingo/studio..." &&
      corepack pnpm --filter @ricingo/studio build
    startCommand: corepack pnpm --filter @ricingo/studio start
    envVars:
      - key: NODE_VERSION
        value: '22'
      # `next start --port 3000` (apps/studio/package.json).
      - key: PORT
        value: '3000'
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      # The API's host:port on the private network; the Studio calls it over HTTP.
      - key: RICI_API_HOSTPORT
        fromService:
          type: web
          name: rici-api
          property: hostport
