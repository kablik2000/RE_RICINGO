name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks on the tagged commit before it builds images.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version taken from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test # jest detects CI=true automatically (Python checks run in the "api" job)

      - name: Bundle check (Android, iOS, web)
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir dist

      - name: Teacher Studio production build
        run: pnpm --filter @ricingo/studio build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api:
    name: Backend (Flask) checks and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rici
          POSTGRES_PASSWORD: rici_dev_password
          POSTGRES_DB: rici
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rici" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rici:rici_dev_password@localhost:5432/rici_test
      REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

      - name: Docker image builds
        run: docker build --tag rici-api:ci .
